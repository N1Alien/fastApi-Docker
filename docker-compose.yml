version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@host:5432/db
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
      
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Automatyczne pobranie modeli przy starcie (opcjonalnie)
    # command: serve

volumes:
  ollama_data:
